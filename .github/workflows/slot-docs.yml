name: Slot Documentation

on:
  # Run after CI completes on any branch
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
  # Manual trigger from any branch
  workflow_dispatch:
  # Also run on push to allow testing the workflow itself
  push:
    branches:
      - "**"
    paths:
      - ".github/workflows/slot-docs.yml"
      - "scripts/generate_slot_docs.py"
      - "scripts/create_thumbnail.py"
      - "scripts/normalize_images.py"

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one deployment at a time, but DO NOT cancel an in-progress
# run. slot-docs is triggered very frequently (workflow_run after CI on
# every branch, plus pushes); with cancel-in-progress:true every new
# trigger killed the previous run before it could finish aggregating
# images and deploying, so the robust-downloader page (no "-" cells)
# never actually published. With cancel-in-progress:false the runs
# serialize and each completes; the latest deploys the freshest
# aggregated content (GitHub Pages deploys are idempotent).
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Run on: push, manual dispatch, or successful CI completion
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Generate slot documentation
        run: |
          uv run scripts/generate_slot_docs.py -o _site

      - name: Download images from CI artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Aggregate the freshest render image per slot/config across recent
          # CI + IO Configurations runs (newest-first, conclusion-agnostic).
          # A single flaky job among the ~74 IO Configuration builds marks the
          # whole run "failure"; selecting only success/cancelled runs would
          # then fall back to a stale or expired run and leave "-" placeholders
          # on the page. Newest-wins aggregation backfills every config from
          # the newest run that still has its artifact.
          uv run scripts/download_slot_images.py \
            --repo "${{ github.repository }}" \
            --branch "${{ github.ref_name }}" \
            --out _site/images \
            --max-runs 60

      - name: Normalize images to consistent scale
        run: |
          # Normalize all images to the same pixel/mm scale
          if ls _site/images/*.png 1>/dev/null 2>&1; then
            uv run scripts/normalize_images.py _site/images librelane/slots
          else
            echo "No images to normalize"
          fi

      - name: Create thumbnails
        run: |
          # Create thumbnails from normalized images
          mkdir -p _site/thumbnails
          for PNG in _site/images/*.png; do
            [ -f "$PNG" ] || continue
            BASENAME=$(basename "$PNG" .png)
            uv run scripts/create_thumbnail.py "$PNG" "_site/thumbnails/${BASENAME}.jpg"
          done

      - name: Regenerate HTML with images
        run: |
          # Regenerate to include image paths now that images exist
          uv run scripts/generate_slot_docs.py -o _site

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
