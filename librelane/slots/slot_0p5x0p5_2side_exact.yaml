# Exact-pad 2-side configuration -- AUTOGENERATED by
# scripts/generate_exact_3side_configs.py.  DO NOT EDIT BY HAND.
#
# Quarter-size slot_1x1 with the N+E edges as bare cut edges (kept SW corner).
# Every pad is pinned (via a custom PAD_CFG) to the EXACT (x,y) it
# occupies in a real slot_1x1 build.  slot_1x1's analog pads sit on
# the cut-away corner, so this slot has NO analog pads (the core-
# unused analog_PAD port is dropped via NO_ANALOG_PADS).
FP_SIZING: absolute
DIE_AREA: [0, 0, 1966, 2561]
CORE_AREA: [442, 442, 1800, 2400]

VERILOG_DEFINES: ["SLOT_0P5X0P5_2SIDE_EXACT"]

# Partial padring (2-sided): use the partial PDN script.
# The exact-pad variant wraps pdn_partial.tcl with a pre-PDN destroy
# of wafer_space_logo (whose Metal5 OBS at the NE corner otherwise
# collides with the bare-edge IO row extension fillers).
PDN_CFG: dir::pdn_partial_exact.tcl

# Custom pad config: explicit per-pad placement at exact slot_1x1
# coordinates (bypasses pad_cfg.tcl's even auto-distribution).
